name: drink_water
description: "A mobile app for tracking water consumption throughout the day"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  percent_indicator: ^4.2.5
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.0
  app_links: ^7.0.0
  intl: any
  get_it: ^8.0.0
  injectable: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/drinkWaterLogoNoText.png"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.0
  injectable_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 800
  assets:
    - assets/images/